name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_analyzers:
        description: 'auto: analyzers in build only | always: both phases | never: skip entirely'
        required: false
        default: 'auto'
        type: choice
        options: [auto, always, never]
      runner_count:
        description: 'Number of parallel test runners'
        required: false
        default: '2'
        type: choice
        options: ['1', '2', '3', '4']
      upload_coverage:
        description: 'Upload code coverage as artifact'
        required: false
        default: false
        type: boolean
      validation_scope:
        description: 'Validation scope for this branch dispatch'
        required: false
        default: 'full'
        type: choice
        options: [full, subset, guidance-only]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Validation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          changed_files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$PR_BASE_SHA" ]; then
              changed_files=$(git diff --name-only "$PR_BASE_SHA"...HEAD 2>/dev/null || echo "")
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff --name-only "$PUSH_BEFORE"..HEAD 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$changed_files" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No changed files detected — will fall back to full."
          else
            # Newline-delimited to comma-delimited
            csv=$(echo "$changed_files" | tr '\n' ',' | sed 's/,$//')
            echo "files=$csv" >> "$GITHUB_OUTPUT"
            echo "Detected $(echo "$changed_files" | wc -l) changed files."
          fi

      - name: Resolve validation scope
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || 'false' }}
          REQUESTED_SCOPE: ${{ inputs.validation_scope || '' }}
          DRAFT_MODE: ${{ vars.CI_DRAFT_MODE || 'subset' }}
          CHANGED_FILES_CSV: ${{ steps.paths.outputs.files }}
        run: |
          $changedFiles = @()
          if ($env:CHANGED_FILES_CSV) {
              $changedFiles = $env:CHANGED_FILES_CSV -split ','
          }

          $scope = & ./scripts/guidance/Resolve-ValidationScope.ps1 `
              -EventName $env:EVENT_NAME `
              -RequestedScope $env:REQUESTED_SCOPE `
              -IsDraft ([bool]::Parse($env:IS_DRAFT)) `
              -DraftMode $env:DRAFT_MODE `
              -ChangedFiles $changedFiles

          echo "scope=$scope" >> $env:GITHUB_OUTPUT
          echo "Validation scope: $scope"

          # Job summary
          $summary = @"
          ## Validation Plan

          | Property | Value |
          |---|---|
          | Event | $env:EVENT_NAME |
          | Scope | ``$scope`` |
          | Changed files | $($changedFiles.Count) |
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY

  # Guidance-only gate — lightweight validation for documentation/design/instruction
  # changes that don't affect runtime, frontend, or deployment.
  guidance:
    name: Guidance gate
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'guidance-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @(
            Get-ChildItem -Recurse -File -Filter '*.ps1' |
              ForEach-Object {
                $tokens = $null
                $parseErrors = $null
                [void][Management.Automation.Language.Parser]::ParseFile(
                    $_.FullName,
                    [ref]$tokens,
                    [ref]$parseErrors)
                $parseErrors
              }
          )
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
              exit 1
          }

      - name: Validate guidance contract
        shell: pwsh
        run: ./tests/Test-Guidance.ps1

      - name: Validate path-aware scope resolution
        shell: pwsh
        run: ./tests/Test-ValidationScope.ps1

  # Frontend quality gate — runs the bundled SPA's OWN complete pipeline (build +
  # lint + format:check + tsc + tests) in its own Node toolchain, exactly as the
  # standalone frontend template enforces it. Kept separate from the .NET jobs:
  # composition must never make the embedded frontend weaker than standalone.
  frontend:
    name: Frontend gate
    needs: validation-plan
    if: >-
      needs.validation-plan.outputs.scope == 'full' ||
      needs.validation-plan.outputs.scope == 'subset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-gate
        with:
          working-directory: src/PitCrew.Dashboard.WebApi/ClientApp

  build:
    needs: validation-plan
    if: >-
      needs.validation-plan.outputs.scope == 'full' ||
      needs.validation-plan.outputs.scope == 'subset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batch_count: ${{ steps.assign.outputs.batch_count }}
      batch_matrix: ${{ steps.assign.outputs.batch_matrix }}
      batch_0: ${{ steps.assign.outputs.batch_0 }}
      batch_1: ${{ steps.assign.outputs.batch_1 }}
      batch_2: ${{ steps.assign.outputs.batch_2 }}
      batch_3: ${{ steps.assign.outputs.batch_3 }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @(
            Get-ChildItem -Recurse -File -Filter '*.ps1' |
              ForEach-Object {
                $tokens = $null
                $parseErrors = $null
                [void][Management.Automation.Language.Parser]::ParseFile(
                    $_.FullName,
                    [ref]$tokens,
                    [ref]$parseErrors)
                $parseErrors
              }
          )
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
              exit 1
          }

      - name: Validate guidance contract
        shell: pwsh
        run: ./tests/Test-Guidance.ps1

      - name: Validate path-aware scope resolution
        shell: pwsh
        run: ./tests/Test-ValidationScope.ps1

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: |
          ANALYZER_FLAGS=""
          ANALYZER_MODE="${{ inputs.enable_analyzers }}"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "🔍 Analyzers enabled (auto mode for ${{ github.event_name }})"
          elif [ "$ANALYZER_MODE" = "never" ]; then
            echo "⚡ Analyzers disabled — faster build"
            ANALYZER_FLAGS="-p:RunAnalyzersDuringBuild=false -p:RunAnalyzersDuringCompilation=false -p:EnforceCodeStyleInBuild=false"
          else
            echo "🔍 Analyzers enabled (mode: $ANALYZER_MODE)"
          fi

          dotnet build --configuration Release $ANALYZER_FLAGS

      - name: Restore test timing cache
        id: timings_cache
        uses: actions/cache/restore@v6
        with:
          path: test-timings.json
          key: test-timings-${{ github.ref_name }}
          restore-keys: |
            test-timings-main

      - name: Discover and assign test batches
        id: assign
        run: |
          RUNNER_COUNT=${{ inputs.runner_count || '2' }}
          echo "🔍 Discovering test projects for $RUNNER_COUNT runners..."

          HAVE_TIMINGS=false
          declare -A TIMINGS
          if [ -f "test-timings.json" ]; then
            echo "📊 Found timing data from previous run"
            while IFS='=' read -r key val; do
              TIMINGS["$key"]="$val"
            done < <(python3 -c "
          import json
          with open('test-timings.json') as f:
              d = json.load(f)
          for k, v in d.items():
              print(f'{k}={v}')
          " 2>/dev/null || true)
            if [ ${#TIMINGS[@]} -gt 0 ]; then
              HAVE_TIMINGS=true
              echo "   Loaded ${#TIMINGS[@]} project timings"
            fi
          else
            echo "ℹ️ No timing cache found — using round-robin assignment"
          fi

          ALL_DLLS=()
          while IFS= read -r dll; do
            DLL_NAME=$(basename "$dll" .dll)
            PROJECT_DIR=$(basename "${dll%%/bin/Release/*}")
            if [ "$DLL_NAME" != "$PROJECT_DIR" ]; then
              continue
            fi
            ALL_DLLS+=("$dll")
          done < <(find . -type f -path "*/bin/Release/net*/*.Tests.dll" | sort)

          if [ ${#ALL_DLLS[@]} -eq 0 ]; then
            echo "::error::No test DLLs were discovered after a successful build."
            exit 1
          fi

          if [ "$RUNNER_COUNT" -gt "${#ALL_DLLS[@]}" ]; then
            RUNNER_COUNT=${#ALL_DLLS[@]}
          fi

          echo "📦 Found ${#ALL_DLLS[@]} test DLLs"

          for ((i=0; i<RUNNER_COUNT; i++)); do
            eval "BATCH_${i}=()"
            eval "BATCH_TOTAL_${i}=0"
          done

          if [ "$HAVE_TIMINGS" = true ]; then
            KNOWN_VALS=()
            for dll in "${ALL_DLLS[@]}"; do
              NAME=$(basename "$dll" .dll)
              if [ -n "${TIMINGS[$NAME]+x}" ]; then
                KNOWN_VALS+=("${TIMINGS[$NAME]}")
              fi
            done
            MEDIAN=$(printf '%s\n' "${KNOWN_VALS[@]}" 2>/dev/null | sort -n | awk '{a[NR]=$1} END{print a[int((NR+1)/2)]}')
            MEDIAN=${MEDIAN:-30}

            SORTED_LIST=()
            for dll in "${ALL_DLLS[@]}"; do
              NAME=$(basename "$dll" .dll)
              DUR="${TIMINGS[$NAME]:-$MEDIAN}"
              SORTED_LIST+=("$DUR $dll")
            done
            IFS=$'\n' SORTED_LIST=($(printf '%s\n' "${SORTED_LIST[@]}" | sort -rn)); unset IFS

            for entry in "${SORTED_LIST[@]}"; do
              DUR=$(echo "$entry" | cut -d' ' -f1)
              DLL=$(echo "$entry" | cut -d' ' -f2-)
              MIN_SLOT=0
              eval "MIN_TOTAL=\$BATCH_TOTAL_0"
              for ((i=1; i<RUNNER_COUNT; i++)); do
                eval "SLOT_TOTAL=\$BATCH_TOTAL_${i}"
                if [ "$SLOT_TOTAL" -lt "$MIN_TOTAL" ]; then
                  MIN_SLOT=$i
                  MIN_TOTAL=$SLOT_TOTAL
                fi
              done
              eval "BATCH_${MIN_SLOT}+=(\"$DLL\")"
              eval "BATCH_TOTAL_${MIN_SLOT}=\$((BATCH_TOTAL_${MIN_SLOT} + DUR))"
            done
          else
            RR_SLOT=0
            for dll in "${ALL_DLLS[@]}"; do
              SLOT=$((RR_SLOT % RUNNER_COUNT))
              eval "BATCH_${SLOT}+=(\"$dll\")"
              RR_SLOT=$((RR_SLOT + 1))
            done
          fi

          MATRIX_INDICES="["
          for ((i=0; i<RUNNER_COUNT; i++)); do
            eval "ITEMS=(\"\${BATCH_${i}[@]}\")"
            JOINED=$(IFS=' '; echo "${ITEMS[*]}")
            echo "batch_${i}=$JOINED" >> "$GITHUB_OUTPUT"
            if [ $i -gt 0 ]; then MATRIX_INDICES+=","; fi
            MATRIX_INDICES+="$i"
          done
          MATRIX_INDICES+="]"

          echo "batch_count=$RUNNER_COUNT" >> "$GITHUB_OUTPUT"
          echo "batch_matrix=$MATRIX_INDICES" >> "$GITHUB_OUTPUT"
          echo "✅ Assigned ${#ALL_DLLS[@]} test DLLs across $RUNNER_COUNT batches"

      - name: Strip unused runtime payloads
        run: |
          find . -type d -path "*/bin/*/runtimes/win-*" -prune -exec rm -rf {} + || true
          find . -type d -path "*/bin/*/runtimes/osx-*" -prune -exec rm -rf {} + || true
          find . -type d -path "*/bin/*/runtimes/linux-musl-*" -prune -exec rm -rf {} + || true
          find . -type d -path "*/bin/*/runtimes/linux-arm*" -prune -exec rm -rf {} + || true

      - name: Package build output
        run: |
          find . -path "*/bin/Release" -type d | sed 's|^\./||' | tar cf - -T - | zstd --long=28 -3 -T0 -o build-output.tar.zst
          ls -lh build-output.tar.zst

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build-output.tar.zst
          retention-days: 1
          compression-level: 0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validation-plan, build]
    if: >-
      needs.validation-plan.outputs.scope == 'full' &&
      needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.build.outputs.batch_matrix) }}

    # ── Database services placeholder ──
    # Uncomment and configure when your tests require a database.
    # services:
    #   mysql:
    #     image: mysql:8.0
    #     env:
    #       MYSQL_ROOT_PASSWORD: testpassword
    #       MYSQL_USER: testuser
    #       MYSQL_PASSWORD: testpassword
    #       MYSQL_DATABASE: ''
    #     ports:
    #       - 3306:3306
    #     options: >-
    #       --health-cmd="mysqladmin ping"
    #       --health-interval=10s
    #       --health-timeout=5s
    #       --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Extract build output
        run: |
          zstd -dc --long=28 build-output.tar.zst | tar xf -
          rm build-output.tar.zst

      # ── Database setup placeholder ──
      # Uncomment when database services are enabled above.
      # - name: Configure database
      #   run: |
      #     # Wait for database to be ready and run any setup commands
      #     echo "TODO: Configure database for tests"

      - name: Resolve batch projects
        id: batch
        run: |
          case "${{ matrix.batch }}" in
            0) PROJECTS="${{ needs.build.outputs.batch_0 }}" ;;
            1) PROJECTS="${{ needs.build.outputs.batch_1 }}" ;;
            2) PROJECTS="${{ needs.build.outputs.batch_2 }}" ;;
            3) PROJECTS="${{ needs.build.outputs.batch_3 }}" ;;
          esac

          if [ -z "$PROJECTS" ]; then
            echo "::error::No test projects were assigned to batch ${{ matrix.batch }}."
            exit 1
          fi

          echo "📋 Batch ${{ matrix.batch }} projects:"
          echo "$PROJECTS" | tr ' ' '\n'
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

      - name: Run tests (batch ${{ matrix.batch }})
        id: run_tests
        run: |
          rm -rf ./TestResults
          mkdir -p ./TestResults

          DLLS="${{ steps.batch.outputs.projects }}"
          if [ -z "$DLLS" ]; then
            echo "::error::No test projects were provided to batch ${{ matrix.batch }}."
            exit 1
          fi

          BATCH_EXIT=0
          TIMING_JSON="{"
          FIRST_TIMING=true
          for DLL_PATH in $DLLS; do
            DLL_NAME=$(basename "$DLL_PATH" .dll)

            if [ ! -f "$DLL_PATH" ]; then
              echo "::error::Test DLL not found: $DLL_PATH"
              BATCH_EXIT=1
              continue
            fi

            echo ""
            echo "━━━ $DLL_NAME ━━━"

            START_TIME=$(date +%s)
            set +e
            dotnet exec "$DLL_PATH" --report-trx --report-trx-filename "$DLL_NAME.trx" --results-directory ./TestResults
            EXIT_CODE=$?
            set -e
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))

            if [ "$FIRST_TIMING" = true ]; then FIRST_TIMING=false; else TIMING_JSON+=","; fi
            TIMING_JSON+="\"$DLL_NAME\":$ELAPSED"

            if [ $EXIT_CODE -ne 0 ]; then
              echo "❌ $DLL_NAME failed (exit $EXIT_CODE) [${ELAPSED}s]"
              BATCH_EXIT=1
            else
              echo "✅ $DLL_NAME passed [${ELAPSED}s]"
            fi
          done
          TIMING_JSON+="}"

          echo "$TIMING_JSON" > "test-timings-batch-${{ matrix.batch }}.json"
          echo "batch_exit=$BATCH_EXIT" >> "$GITHUB_OUTPUT"

          if [ $BATCH_EXIT -ne 0 ]; then
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-batch-${{ matrix.batch }}
          path: ./TestResults/*.trx
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: inputs.upload_coverage && always()
        with:
          name: coverage-batch-${{ matrix.batch }}
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload timing data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-timings-batch-${{ matrix.batch }}
          path: test-timings-batch-${{ matrix.batch }}.json
          retention-days: 1
          if-no-files-found: ignore

  support-package:
    name: Support plane package
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate support installer structure
        shell: pwsh
        run: ./tests/Test-SupportPlaneInstaller.Structural.ps1

      - name: Validate support release gate
        shell: pwsh
        run: ./tests/Test-SupportReleaseGate.ps1

      - name: Package Linux support plane
        shell: pwsh
        run: |
          ./scripts/package-support-plane.ps1 `
              -Configuration Release `
              -Version 0.0.0-ci `
              -RuntimeIdentifiers linux-x64 `
              -OutputRoot artifacts/support-plane-ci

      - name: Verify support package checksums
        shell: pwsh
        run: |
          $archives = @(
              Get-ChildItem `
                  -LiteralPath artifacts/support-plane-ci/archives `
                  -Filter '*.tar.gz' `
                  -File)
          if ($archives.Count -ne 4) {
              throw "Expected four support archives, found $($archives.Count)."
          }
          foreach ($archive in $archives) {
              $checksumPath = "$($archive.FullName).sha256"
              if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
                  throw "Missing checksum for '$($archive.Name)'."
              }
              $expected = (
                  Get-Content -LiteralPath $checksumPath -Raw
              ).Split(' ', [StringSplitOptions]::RemoveEmptyEntries)[0]
              $actual = (
                  Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ($actual -cne $expected) {
                  throw "Checksum mismatch for '$($archive.Name)'."
              }
          }

  linux-installer:
    name: Linux installers
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Ensure POSIX ACL tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v setfacl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes acl
          fi

      - name: Publish Linux support services
        shell: pwsh
        run: |
          dotnet publish `
              src/PitCrew.Support.Agent.App/PitCrew.Support.Agent.App.csproj `
              --configuration Release `
              --runtime linux-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/support-agent"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish `
              src/PitCrew.Support.Broker.App/PitCrew.Support.Broker.App.csproj `
              --configuration Release `
              --runtime linux-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/support-broker"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate systemd installation and rollback
        run: >-
          sudo pwsh ./tests/Test-CapacityOperationsInstaller.ps1
          -AllowMachineChanges

      - name: Validate isolated support lifecycle and outbound denial
        run: >-
          sudo pwsh ./tests/Test-SupportPlaneInstaller.ps1
          -AgentPublishRoot "$RUNNER_TEMP/support-agent"
          -BrokerPublishRoot "$RUNNER_TEMP/support-broker"
          -AllowMachineChanges

  windows-installer:
    name: Windows installers
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate Windows named-pipe isolation
        shell: pwsh
        run: >-
          dotnet test --project
          src/PitCrew.Support.Broker.App.Tests/PitCrew.Support.Broker.App.Tests.csproj
          --configuration Release

      - name: Publish Windows connector
        shell: pwsh
        run: |
          dotnet publish `
              src/PitCrew.Connector.App/PitCrew.Connector.App.csproj `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/connector"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Publish Windows support services
        shell: pwsh
        run: |
          dotnet publish `
              src/PitCrew.Support.Agent.App/PitCrew.Support.Agent.App.csproj `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/support-agent"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows network probe
        shell: pwsh
        run: |
          dotnet publish `
              tests/PitCrew.Support.NetworkProbe.App/PitCrew.Support.NetworkProbe.App.csproj `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/support-network-probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish `
              src/PitCrew.Support.Broker.App/PitCrew.Support.Broker.App.csproj `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --output "$env:RUNNER_TEMP/support-broker"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows Service installation and rollback
        shell: pwsh
        run: |
          ./tests/Test-CapacityOperationsInstaller.ps1 `
              -ConnectorPublishRoot "$env:RUNNER_TEMP/connector" `
              -AllowMachineChanges

      - name: Validate isolated support lifecycle and outbound denial
        shell: pwsh
        run: |
          ./tests/Test-SupportPlaneInstaller.ps1 `
              -AgentPublishRoot "$env:RUNNER_TEMP/support-agent" `
              -BrokerPublishRoot "$env:RUNNER_TEMP/support-broker" `
              -NetworkProbePublishRoot "$env:RUNNER_TEMP/support-network-probe" `
              -AllowMachineChanges

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validation-plan, guidance, frontend, build, test, support-package, linux-installer, windows-installer]
    if: always()
    steps:
      - name: Check validation results
        env:
          SCOPE: ${{ needs.validation-plan.outputs.scope }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          GUIDANCE_RESULT: ${{ needs.guidance.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SUPPORT_PACKAGE_RESULT: ${{ needs.support-package.result }}
          LINUX_INSTALLER_RESULT: ${{ needs.linux-installer.result }}
          WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Validation planning failed."
            exit 1
          fi

          for result in \
            "$GUIDANCE_RESULT" \
            "$FRONTEND_RESULT" \
            "$BUILD_RESULT" \
            "$TEST_RESULT" \
            "$SUPPORT_PACKAGE_RESULT" \
            "$LINUX_INSTALLER_RESULT" \
            "$WINDOWS_INSTALLER_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A validation job failed or was cancelled."
              exit 1
            fi
          done

          case "$SCOPE" in
            full)
              if [ "$FRONTEND_RESULT" != "success" ] ||
                 [ "$BUILD_RESULT" != "success" ] ||
                 [ "$TEST_RESULT" != "success" ] ||
                 [ "$SUPPORT_PACKAGE_RESULT" != "success" ] ||
                 [ "$LINUX_INSTALLER_RESULT" != "success" ] ||
                 [ "$WINDOWS_INSTALLER_RESULT" != "success" ]; then
                echo "::error::Full validation did not complete successfully."
                exit 1
              fi
              ;;
            subset)
              if [ "$FRONTEND_RESULT" != "success" ] ||
                 [ "$BUILD_RESULT" != "success" ] ||
                 [ "$TEST_RESULT" != "skipped" ] ||
                 [ "$SUPPORT_PACKAGE_RESULT" != "skipped" ] ||
                 [ "$LINUX_INSTALLER_RESULT" != "skipped" ] ||
                 [ "$WINDOWS_INSTALLER_RESULT" != "skipped" ]; then
                echo "::error::Draft subset validation did not complete as planned."
                exit 1
              fi
              ;;
            ready-only)
              if [ "$FRONTEND_RESULT" != "skipped" ] ||
                 [ "$BUILD_RESULT" != "skipped" ] ||
                 [ "$TEST_RESULT" != "skipped" ] ||
                 [ "$SUPPORT_PACKAGE_RESULT" != "skipped" ] ||
                 [ "$LINUX_INSTALLER_RESULT" != "skipped" ] ||
                 [ "$WINDOWS_INSTALLER_RESULT" != "skipped" ]; then
                echo "::error::Ready-only draft validation ran unexpected jobs."
                exit 1
              fi
              ;;
            guidance-only)
              if [ "$GUIDANCE_RESULT" != "success" ]; then
                echo "::error::Guidance gate did not succeed for guidance-only scope."
                exit 1
              fi
              if [ "$FRONTEND_RESULT" != "skipped" ] ||
                 [ "$BUILD_RESULT" != "skipped" ] ||
                 [ "$TEST_RESULT" != "skipped" ] ||
                 [ "$SUPPORT_PACKAGE_RESULT" != "skipped" ] ||
                 [ "$LINUX_INSTALLER_RESULT" != "skipped" ] ||
                 [ "$WINDOWS_INSTALLER_RESULT" != "skipped" ]; then
                echo "::error::Guidance-only validation ran unexpected expensive jobs."
                exit 1
              fi
              ;;
            *)
              echo "::error::Validation plan produced unsupported scope '$SCOPE'."
              exit 1
              ;;
          esac

          echo "Validation scope '$SCOPE' passed."

  required:
    name: CI required
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve existing required check
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::Stable CI summary finished with '$CI_RESULT'."
            exit 1
          fi

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    steps:
      - name: Delete build artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: build-output

      - name: Download timing fragments
        if: needs.test.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: test-timings-batch-*
          merge-multiple: true

      - name: Consolidate and cache timing data
        if: needs.test.result == 'success'
        run: |
          python3 -c "
          import json, glob, os
          merged = {}
          for f in sorted(glob.glob('test-timings-batch-*.json')):
              try:
                  with open(f) as fh:
                      merged.update(json.load(fh))
                  print(f'   Loaded from {os.path.basename(f)}')
              except Exception as e:
                  print(f'   ⚠️ Failed: {f}: {e}')
          print(f'📊 Total: {len(merged)} project timings')
          with open('test-timings.json', 'w') as out:
              json.dump(merged, out, indent=2, sort_keys=True)
          "

      - name: Save timing cache
        if: needs.test.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: test-timings.json
          key: test-timings-${{ github.ref_name }}

      - name: Delete timing artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-timings-batch-*
