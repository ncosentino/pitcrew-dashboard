name: Browser UX evidence (advisory)

# Advisory workflow for issue #84: runs the Playwright + axe-core browser UX
# harness (`npm run test:browser` in the dashboard SPA) and the Impeccable
# visual-antipattern detector, uploading screenshots, metrics, accessibility
# reports, and detector output as PR evidence.
#
# Intentionally NOT added to .github/genesis-delivery.json's requiredChecks:
# this check name is advisory and must never block merges while the harness
# is new and while ADR-0007's known baseline defects (see
# src/PitCrew.Dashboard.WebApi/ClientApp/e2e/support/axe.ts and
# e2e/routes.spec.ts) are still open. Kept as its own workflow file (rather
# than a job inside ci.yml) with paths scoped to the dashboard SPA so issue
# #91 can later promote specific gates to required independently, without
# renaming or restructuring the existing "CI" required check.
#
# `types` explicitly excludes plain draft `synchronize` churn from running
# the expensive Playwright install/suite: the job-level `if:` below only
# runs on `workflow_dispatch` or a non-draft pull request (gated further by
# `ready_for_review`, or a push while already-ready), so pushing commits to
# a draft PR does not repeatedly pay for a Chromium install and full
# browser suite run before the author is ready for evidence/review.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/PitCrew.Dashboard.WebApi/ClientApp/**'
      - '.github/workflows/browser-ux.yml'
      - '.github/skills/impeccable/**'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - '.impeccable/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: browser-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ux:
    name: Browser UX evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the expensive browser install/suite for draft-PR synchronize
    # events; `workflow_dispatch` (no pull_request context) and any
    # non-draft pull_request event still run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: src/PitCrew.Dashboard.WebApi/ClientApp
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/PitCrew.Dashboard.WebApi/ClientApp
        run: npx playwright install --with-deps chromium

      - name: Run browser UX evidence suite
        working-directory: src/PitCrew.Dashboard.WebApi/ClientApp
        run: npm run test:browser

      - name: Upload browser UX evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ux-evidence
          path: |
            src/PitCrew.Dashboard.WebApi/ClientApp/e2e/.artifacts/html-report
            src/PitCrew.Dashboard.WebApi/ClientApp/e2e/.artifacts/axe
            src/PitCrew.Dashboard.WebApi/ClientApp/e2e/.artifacts/metrics
          retention-days: 7
          if-no-files-found: warn

      # `test-results` (playwright.config.ts's `outputDir`) holds per-test
      # traces (`trace: 'retain-on-failure'`) plus any screenshots/videos
      # Playwright itself captures on failure. An early failure (e.g. the
      # dev server never comes up, or a test throws before its own
      # route-level testInfo.attach calls run) can leave the report/axe/
      # metrics artifacts above empty or incomplete, so this directory is
      # uploaded separately to keep failures diagnosable even then.
      - name: Upload browser UX failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ux-failure-diagnostics
          path: src/PitCrew.Dashboard.WebApi/ClientApp/e2e/.artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Impeccable detector
        if: always()
        id: impeccable
        run: |
          set +e
          node .github/skills/impeccable/scripts/detect.mjs --json \
            src/PitCrew.Dashboard.WebApi/ClientApp/src > impeccable-report.json
          status=$?
          set -e

          # Exit code contract (.github/skills/impeccable/scripts/detector/cli/main.mjs):
          #   0 = clean scan (or advisory-only findings)
          #   2 = primary findings detected
          #   1 = usage/execution error (detector itself broken)
          # Detector *findings* stay advisory here by design (they must never
          # block this already-advisory workflow), but detector *execution*
          # failing is NOT tolerated: any exit code other than 0 or 2 means
          # the detector could not actually run, which would otherwise
          # silently hide a broken advisory gate instead of surfacing it.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::Impeccable detector failed to execute (exit $status)."
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "::notice::Impeccable detector reported findings (advisory; see impeccable-report.json)."
          fi

      - name: Upload Impeccable detector report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impeccable-detector-report
          path: impeccable-report.json
          retention-days: 7
          if-no-files-found: warn
