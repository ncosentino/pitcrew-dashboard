name: Verify published release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published canonical release tag'
        required: true
        type: string
      release_sha:
        description: 'Full release commit SHA'
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: verify-published-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify release tag and commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          $tagPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ($env:RELEASE_TAG -cnotmatch $tagPattern -or
              $env:RELEASE_SHA -cnotmatch '^[a-f0-9]{40}$') {
              throw 'Release verification requires a canonical tag and full commit SHA.'
          }
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseJson = gh api (
              "repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          ) | Out-String
          if ($LASTEXITCODE -ne 0 -or $releaseJson.Length -gt 4MB) {
              throw 'Published release identity is unavailable or oversized.'
          }
          $release = $releaseJson | ConvertFrom-Json -Depth 20
          if ([bool]$release.draft -or
              [string]$release.target_commitish -cne $env:RELEASE_SHA) {
              throw 'Published release identity does not match the requested commit.'
          }

  assets:
    name: Release assets
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download \
            "$RELEASE_TAG" \
            --dir "$RUNNER_TEMP/published-release"

      - name: Verify complete asset inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $rids = @('linux-x64', 'linux-arm64', 'win-x64', 'win-arm64')
          $expected = [Collections.Generic.List[string]]::new()
          foreach ($rid in $rids) {
              foreach ($component in @(
                      'agent',
                      'broker',
                      'relay',
                      'installer'
                  )) {
                  $name = "pitcrew-support-$component-$version-$rid.tar.gz"
                  $expected.Add($name)
                  $expected.Add("$name.sha256")
              }
              $connector = "pitcrew-connector-$version-$rid.tar.gz"
              $expected.Add($connector)
              $expected.Add("$connector.sha256")
          }
          $expected.Add('Enable-PitCrewCapacityOperations.ps1')
          $files = @(
              Get-ChildItem `
                  -LiteralPath "$env:RUNNER_TEMP/published-release" `
                  -File |
                  Select-Object -ExpandProperty FullName
          )
          ./scripts/release/Test-PublishedReleaseAssets.ps1 `
              -ReleaseTag $env:RELEASE_TAG `
              -ExpectedReleaseSha $env:RELEASE_SHA `
              -ExpectedAssetName $expected.ToArray() `
              -FilePath $files

  images:
    name: Image ${{ matrix.name }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            suffix: ''
          - name: connector
            suffix: '-connector'
          - name: support-relay
            suffix: '-support-relay'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify image index and provenance
        shell: pwsh
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/Test-PublishedContainerImage.ps1 `
              -ImageName $env:IMAGE_NAME `
              -ReleaseTag $env:RELEASE_TAG `
              -ReleaseSha $env:RELEASE_SHA `
              -RequireProvenanceAttestation
