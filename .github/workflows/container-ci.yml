name: Container image

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-plan:
    name: Container plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine container scope
        id: plan
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          $isDraft = '${{ github.event.pull_request.draft }}' -eq 'true'
          if ($eventName -eq 'pull_request' -and $isDraft) {
              "scope=skip" >> $env:GITHUB_OUTPUT
              "Draft PR - container validation skipped."
              exit 0
          }

          $changedFiles = @()
          if ($eventName -eq 'pull_request') {
              $base = '${{ github.event.pull_request.base.sha }}'
              if ($base) {
                  $changedFiles = @(git diff --name-only "$base...HEAD")
                  if ($LASTEXITCODE -ne 0) {
                      Write-Warning 'Changed-path detection failed; falling back to full validation.'
                      $changedFiles = @()
                  }
              }
          }
          elseif ($eventName -eq 'push') {
              $before = '${{ github.event.before }}'
              if ($before -and $before -ne ('0' * 40)) {
                  $changedFiles = @(git diff --name-only "$before..HEAD")
                  if ($LASTEXITCODE -ne 0) {
                      Write-Warning 'Changed-path detection failed; falling back to full validation.'
                      $changedFiles = @()
                  }
              }
          }

          $scope = & ./scripts/guidance/Resolve-ValidationScope.ps1 `
              -EventName $eventName `
              -ChangedFiles $changedFiles
          $containerScope = if ($scope -eq 'guidance-only') { 'skip' } else { 'full' }
          "scope=$containerScope" >> $env:GITHUB_OUTPUT
          "Validation scope '$scope' maps to container scope '$containerScope'."

  deployment-config:
    needs: container-plan
    if: needs.container-plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate hosted support-plane configuration
        shell: pwsh
        run: ./tests/Test-HostedSupportPlaneConfiguration.ps1

      - name: Validate Compose deployment contracts
        env:
          PITCREW_ENROLLMENT_CODE: validation-only
          PITCREW_STATE_ROOT: /tmp/pitcrew-state
          PITCREW_DASHBOARD_PORT: '5080'
          PITCREW_SERVER_NAME: validation
          PITCREW_DASHBOARD_VERSION: 0.12.2
          PITCREW_DASHBOARD_DOMAIN: pitcrew.example.com
          PITCREW_GITHUB_CLIENT_ID: validation
          PITCREW_GITHUB_CLIENT_SECRET: validation
          PITCREW_SYSTEM_ADMIN_GITHUB_ID: '123'
          PITCREW_CLOUDFLARE_TUNNEL_TOKEN_FILE: ./secrets/cloudflare-tunnel-token
          PITCREW_SUPPORT_RELAY_VERSION: 0.12.2
          PITCREW_SUPPORT_RELAY_DOMAIN: relay.example.com
          PITCREW_SUPPORT_RELAY_INTERNAL_BEARER_SECRET: validation-only-support-relay-secret
          PITCREW_SUPPORT_AUTHORIZATION_SIGNING_PRIVATE_KEY_PKCS8: validation-only-signing-key
          PITCREW_SUPPORT_RESULT_DECRYPTION_PRIVATE_KEY_PKCS8: validation-only-decryption-key
        run: |
          mkdir -p secrets
          printf '%s' 'validation-only' > secrets/cloudflare-tunnel-token
          docker compose --file docker-compose.local.yml config --quiet
          docker compose \
            --file docker-compose.hosted.yml \
            config --format json > /tmp/pitcrew-base.json
          docker compose \
            --file docker-compose.hosted.yml \
            --file deploy/caddy.compose.yml \
            config --format json > /tmp/pitcrew-caddy.json
          docker compose \
            --file docker-compose.hosted.yml \
            --file deploy/cloudflare-tunnel.compose.yml \
            config --format json > /tmp/pitcrew-cloudflare.json
          docker compose \
            --file docker-compose.hosted.yml \
            --file deploy/support-relay.compose.yml \
            config --format json > /tmp/pitcrew-support-relay.json
          docker compose \
            --file docker-compose.hosted.yml \
            --file deploy/caddy.compose.yml \
            --file deploy/support-relay.compose.yml \
            --file deploy/support-relay-caddy.compose.yml \
            config --format json > /tmp/pitcrew-caddy-support-relay.json
          docker compose \
            --file docker-compose.hosted.yml \
            --file deploy/cloudflare-tunnel.compose.yml \
            --file deploy/support-relay.compose.yml \
            config --format json > /tmp/pitcrew-cloudflare-support-relay.json

          python3 - <<'PY'
          import json

          with open('/tmp/pitcrew-base.json', encoding='utf-8') as handle:
              base = json.load(handle)
          with open('/tmp/pitcrew-caddy.json', encoding='utf-8') as handle:
              caddy = json.load(handle)
          with open('/tmp/pitcrew-cloudflare.json', encoding='utf-8') as handle:
              cloudflare = json.load(handle)
          with open('/tmp/pitcrew-support-relay.json', encoding='utf-8') as handle:
              support_relay = json.load(handle)
          with open(
              '/tmp/pitcrew-caddy-support-relay.json',
              encoding='utf-8',
          ) as handle:
              caddy_support_relay = json.load(handle)
          with open(
              '/tmp/pitcrew-cloudflare-support-relay.json',
              encoding='utf-8',
          ) as handle:
              cloudflare_support_relay = json.load(handle)

          assert sorted(base['services']) == ['dashboard']
          assert base['services']['dashboard'].get('ports') is None
          dashboard_health_test = ' '.join(
              base['services']['dashboard']['healthcheck']['test']
          )
          assert 'Host: pitcrew.example.com' in dashboard_health_test
          assert '/health/hosted-ingress/v1' in dashboard_health_test
          assert 'pitcrew-dashboard-hosted-ingress-v1' in dashboard_health_test
          assert base['services']['dashboard']['tmpfs'] == [
              '/tmp:size=512m,noexec,nosuid,nodev',
          ]

          assert sorted(caddy['services']) == ['caddy', 'dashboard']
          assert sorted(str(port['published']) for port in caddy['services']['caddy']['ports']) == [
              '443',
              '443',
              '80',
          ]
          assert (
              caddy['services']['dashboard']['environment']
              ['PitCrew__ReverseProxy__KnownProxyAddresses__0']
              == '172.31.0.2'
          )
          assert (
              caddy['services']['caddy']['depends_on']['dashboard']['condition']
              == 'service_healthy'
          )
          assert (
              caddy['services']['caddy']['depends_on']['dashboard']['restart']
              is True
          )

          assert sorted(cloudflare['services']) == ['cloudflared', 'dashboard']
          assert cloudflare['services']['cloudflared'].get('ports') is None
          assert (
              cloudflare['services']['cloudflared']['image']
              == 'cloudflare/cloudflared:2026.7.2'
          )
          assert (
              cloudflare['services']['cloudflared']['secrets'][0]['target']
              == '/run/secrets/cloudflare-tunnel-token'
          )
          assert (
              cloudflare['services']['dashboard']['environment']
              ['PitCrew__ReverseProxy__KnownProxyAddresses__0']
              == '172.31.0.2'
          )
          assert (
              cloudflare['services']['cloudflared']['depends_on']['dashboard']['condition']
              == 'service_healthy'
          )
          assert (
              cloudflare['services']['cloudflared']['depends_on']['dashboard']['restart']
              is True
          )

          assert sorted(support_relay['services']) == ['dashboard', 'support-relay']
          relay = support_relay['services']['support-relay']
          assert relay['image'] == (
              'ghcr.io/ncosentino/'
              'pitcrew-dashboard-support-relay:0.12.2'
          )
          assert relay.get('ports') is None
          assert relay['expose'] == ['8080']
          assert relay['read_only'] is True
          assert relay['cap_drop'] == ['ALL']
          assert relay['security_opt'] == ['no-new-privileges:true']
          assert relay['tmpfs'] == ['/tmp:size=64m,noexec,nosuid,nodev']
          assert relay['environment'] == {
              'ASPNETCORE_ENVIRONMENT': 'Production',
              'SupportRelay__DatabasePath':
                  '/var/lib/pitcrew-support-relay/support-relay.db',
              'SupportRelay__InternalBearerSecret':
                  'validation-only-support-relay-secret',
          }
          assert relay['volumes'] == [{
              'type': 'volume',
              'source': 'support-relay-data',
              'target': '/var/lib/pitcrew-support-relay',
              'volume': {},
          }]
          support_dashboard = support_relay['services']['dashboard']
          assert support_dashboard['depends_on']['support-relay'] == {
              'condition': 'service_healthy',
              'required': True,
              'restart': True,
          }
          support_environment = support_dashboard['environment']
          assert support_environment[
              'PitCrew__SupportPlane__RelayUrl'
          ] == 'https://relay.example.com'
          assert support_environment[
              'PitCrew__SupportPlane__RelayInternalUrl'
          ] == 'http://support-relay-internal:8080'
          assert support_environment[
              'PitCrew__SupportPlane__RelayInternalBearerSecret'
          ] == 'validation-only-support-relay-secret'
          assert support_environment[
              'PitCrew__SupportPlane__AuthorizationSigningPrivateKeyPkcs8'
          ] == 'validation-only-signing-key'
          assert support_environment[
              'PitCrew__SupportPlane__ResultDecryptionPrivateKeyPkcs8'
          ] == 'validation-only-decryption-key'
          assert support_relay['networks'][
              'pitcrew-support-internal'
          ]['internal'] is True
          assert 'pitcrew-support-internal' in support_dashboard['networks']
          assert (
              relay['networks']['pitcrew-support-internal']['aliases']
              == ['support-relay-internal']
          )

          assert sorted(caddy_support_relay['services']) == [
              'caddy',
              'dashboard',
              'support-relay',
          ]
          assert (
              caddy_support_relay['services']['caddy']
              ['depends_on']['support-relay']['condition']
              == 'service_healthy'
          )
          assert (
              'pitcrew-support-internal'
              not in caddy_support_relay['services']['caddy']['networks']
          )
          caddy_mounts = {
              entry['target']: entry['source']
              for entry in caddy_support_relay['services']['caddy']['volumes']
          }
          assert caddy_mounts['/etc/caddy/Caddyfile'].endswith(
              '/deploy/caddy/Caddyfile.support-relay'
          )

          assert sorted(cloudflare_support_relay['services']) == [
              'cloudflared',
              'dashboard',
              'support-relay',
          ]
          assert (
              cloudflare_support_relay['services']['cloudflared'].get('ports')
              is None
          )
          assert (
              cloudflare_support_relay['services']['support-relay'].get('ports')
              is None
          )
          assert (
              'pitcrew-support-internal'
              not in cloudflare_support_relay['services']['cloudflared']['networks']
          )
          PY

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env PITCREW_DASHBOARD_DOMAIN=pitcrew.example.com \
            --volume "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            --env PITCREW_DASHBOARD_DOMAIN=pitcrew.example.com \
            --env PITCREW_SUPPORT_RELAY_DOMAIN=relay.example.com \
            --volume "$PWD/deploy/caddy/Caddyfile.support-relay:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate Cloudflare Tunnel command surface
        run: |
          docker run --rm cloudflare/cloudflared:2026.7.2 version
          docker run --rm cloudflare/cloudflared:2026.7.2 tunnel run --help |
            grep -- '--token-file'
          docker run --rm cloudflare/cloudflared:2026.7.2 tunnel ready --help >/dev/null

  validate:
    needs: container-plan
    if: needs.container-plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            config: .container/image.json
          - name: connector
            config: .container/connector-image.json
          - name: support-relay
            config: .container/support-relay-image.json

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and validate ${{ matrix.name }} image
        shell: pwsh
        run: |
          $result = ./scripts/container/Test-ContainerImage.ps1 `
              -ConfigPath '${{ matrix.config }}' `
              -Mode Validate
          if (-not $result.IsClean) {
              $result.Errors | ForEach-Object { Write-Host "::error::$_" }
              exit 1
          }

          @"
          ## ${{ matrix.name }} container validation

          | Measurement | Value |
          |---|---:|
          | amd64 image bytes | $($result.Amd64ImageBytes) |
          | arm64 OCI archive bytes | $($result.Arm64ArchiveBytes) |
          | Runtime user | $($result.RuntimeUser) |
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

  summary:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft container' || 'Container image' }}
    needs: [container-plan, deployment-config, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTAINER_SCOPE: ${{ needs.container-plan.outputs.scope }}
      PLAN_RESULT: ${{ needs.container-plan.result }}
      DEPLOYMENT_CONFIG_RESULT: ${{ needs.deployment-config.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
    steps:
      - name: Check container validation results
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Container plan failed."
            exit 1
          fi

          for result in "$DEPLOYMENT_CONFIG_RESULT" "$VALIDATE_RESULT"; do
           if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
             echo "::error::A container validation job failed or was cancelled."
             exit 1
           fi
          done

          if [ "$CONTAINER_SCOPE" = "skip" ]; then
            if [ "$DEPLOYMENT_CONFIG_RESULT" != "skipped" ] ||
               [ "$VALIDATE_RESULT" != "skipped" ]; then
              echo "::error::Skipped container scope ran expensive jobs."
              exit 1
            fi
            echo "Container validation intentionally skipped — no relevant paths changed."
            exit 0
          fi

          if [ "$DEPLOYMENT_CONFIG_RESULT" != "success" ] ||
             [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::Container validation did not complete successfully."
            exit 1
          fi
