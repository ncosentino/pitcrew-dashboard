name: Support canary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/support-canary.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/verify-support-release-gate.yml'
      - '.github/workflows/publish-container.yml'
      - '.github/workflows/publish-host-connector.yml'
      - '.github/workflows/publish-support-plane.yml'
      - 'assets/support-plane/**'
      - 'scripts/canary/**'
      - 'scripts/release/**'
      - 'src/PitCrew.Support.*/**'
      - 'src/PitCrew.Dashboard.Features.Support/**'
      - 'src/PitCrew.Dashboard.WebApi/**'
      - 'tests/Test-SupportReleaseGate.ps1'
  workflow_dispatch:
    inputs:
      dashboard_sha:
        description: 'Full pitcrew-dashboard commit SHA'
        required: true
        type: string
      pitcrew_sha:
        description: 'Full PitCrew commit SHA'
        required: true
        type: string
      scenario:
        description: 'Registered canary scenario'
        required: true
        default: 'support-fresh-enrollment-diagnostic-v1'
        type: choice
        options:
          - support-fresh-enrollment-diagnostic-v1
          - topology-smoke-v1
      topology_profile:
        description: 'Topology capability profile'
        required: true
        default: 'portable'
        type: choice
        options:
          - portable
          - windows-installed
  workflow_call:
    inputs:
      dashboard_sha:
        description: 'Full pitcrew-dashboard commit SHA'
        required: true
        type: string
      pitcrew_sha:
        description: 'Full PitCrew commit SHA'
        required: true
        type: string
      scenario:
        description: 'Registered canary scenario'
        required: false
        default: 'support-fresh-enrollment-diagnostic-v1'
        type: string
      topology_profile:
        description: 'Topology capability profile'
        required: false
        default: 'portable'
        type: string

permissions:
  contents: read

concurrency:
  group: support-canary-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.topology_profile || 'pull-request' }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable support canary
    if: >-
      github.event_name == 'pull_request' ||
      inputs.topology_profile == 'portable'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve Dashboard candidate
        id: dashboard
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.dashboard_sha || '' }}
          PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $sha = if ($env:EVENT_NAME -eq 'pull_request') {
              $env:PULL_REQUEST_SHA
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_SHA)) {
              $env:INPUT_SHA
          } else {
              $env:CURRENT_SHA
          }
          if ($sha -cnotmatch '^[a-f0-9]{40}$') {
              throw 'Dashboard candidate must be a full lowercase commit SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out Dashboard candidate
        uses: actions/checkout@v7
        with:
          repository: ncosentino/pitcrew-dashboard
          ref: ${{ steps.dashboard.outputs.sha }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PitCrew candidate
        id: pitcrew
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.pitcrew_sha || '' }}
        run: |
          $sha = $env:INPUT_SHA
          if ($env:EVENT_NAME -eq 'pull_request') {
              $policy = Get-Content `
                  -LiteralPath dashboard/assets/support-plane/support-evidence-policy-v0.10.3.json `
                  -Raw `
                  -Encoding utf8 |
                  ConvertFrom-Json
              $sha = [string]$policy.pitCrewCommit
          }
          if ($sha -cnotmatch '^[a-f0-9]{40}$') {
              throw 'PitCrew candidate must be a full lowercase commit SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out PitCrew candidate
        uses: actions/checkout@v7
        with:
          repository: ncosentino/pitcrew
          ref: ${{ steps.pitcrew.outputs.sha }}
          path: pitcrew
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: dashboard/global.json

      - name: Run candidate canary
        shell: pwsh
        env:
          DASHBOARD_SHA: ${{ steps.dashboard.outputs.sha }}
          PITCREW_SHA: ${{ steps.pitcrew.outputs.sha }}
          SCENARIO: ${{ inputs.scenario || 'support-fresh-enrollment-diagnostic-v1' }}
          TOPOLOGY_PROFILE: ${{ inputs.topology_profile || 'portable' }}
        run: |
          ./dashboard/scripts/canary/Invoke-SupportCanary.ps1 `
              -DashboardSourceRoot "$PWD/dashboard" `
              -DashboardCommit $env:DASHBOARD_SHA `
              -PitCrewSourceRoot "$PWD/pitcrew" `
              -PitCrewCommit $env:PITCREW_SHA `
              -OutputRoot "$env:RUNNER_TEMP/support-canary" `
              -Scenario $env:SCENARIO `
              -TopologyProfile $env:TOPOLOGY_PROFILE `
              -Configuration Release

      - name: Run Aspire testing adapter
        shell: pwsh
        env:
          PITCREW_CANARY_REQUIRE_ASPIRE_TESTING: 'true'
        run: |
          dotnet build `
              dashboard/src/PitCrew.Support.Canary.Tests/PitCrew.Support.Canary.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet exec `
              dashboard/src/PitCrew.Support.Canary.Tests/bin/Release/net10.0/PitCrew.Support.Canary.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Failure evidence is bounded and contains no run state or secrets; the
      # prior canary exit code remains authoritative for the job.
      - name: Upload bounded scenario result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: support-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-canary/*/evidence/*.json
          if-no-files-found: warn
          retention-days: 7

  windows-installed:
    name: Windows-installed support canary
    if: >-
      github.event_name == 'pull_request' ||
      inputs.topology_profile == 'windows-installed'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Resolve Dashboard candidate
        id: dashboard
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.dashboard_sha || '' }}
          PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $sha = if ($env:EVENT_NAME -eq 'pull_request') {
              $env:PULL_REQUEST_SHA
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_SHA)) {
              $env:INPUT_SHA
          } else {
              $env:CURRENT_SHA
          }
          if ($sha -cnotmatch '^[a-f0-9]{40}$') {
              throw 'Dashboard candidate must be a full lowercase commit SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out Dashboard candidate
        uses: actions/checkout@v7
        with:
          repository: ncosentino/pitcrew-dashboard
          ref: ${{ steps.dashboard.outputs.sha }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PitCrew candidate
        id: pitcrew
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.pitcrew_sha || '' }}
        run: |
          $sha = $env:INPUT_SHA
          if ($env:EVENT_NAME -eq 'pull_request') {
              $policy = Get-Content `
                  -LiteralPath dashboard/assets/support-plane/support-evidence-policy-v0.10.3.json `
                  -Raw `
                  -Encoding utf8 |
                  ConvertFrom-Json
              $sha = [string]$policy.pitCrewCommit
          }
          if ($sha -cnotmatch '^[a-f0-9]{40}$') {
              throw 'PitCrew candidate must be a full lowercase commit SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out PitCrew candidate
        uses: actions/checkout@v7
        with:
          repository: ncosentino/pitcrew
          ref: ${{ steps.pitcrew.outputs.sha }}
          path: pitcrew
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: dashboard/global.json

      - name: Run installed candidate canary
        shell: pwsh
        env:
          DASHBOARD_SHA: ${{ steps.dashboard.outputs.sha }}
          PITCREW_SHA: ${{ steps.pitcrew.outputs.sha }}
          SCENARIO: ${{ inputs.scenario || 'support-fresh-enrollment-diagnostic-v1' }}
        run: |
          ./dashboard/scripts/canary/Invoke-SupportCanary.ps1 `
              -DashboardSourceRoot "$PWD/dashboard" `
              -DashboardCommit $env:DASHBOARD_SHA `
              -PitCrewSourceRoot "$PWD/pitcrew" `
              -PitCrewCommit $env:PITCREW_SHA `
              -OutputRoot "$env:RUNNER_TEMP/support-canary" `
              -Scenario $env:SCENARIO `
              -TopologyProfile windows-installed `
              -Configuration Release

      - name: Upload bounded scenario result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: support-canary-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-canary/*/evidence/*.json
          if-no-files-found: warn
          retention-days: 7
